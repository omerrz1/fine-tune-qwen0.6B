
# Base model
model: "Qwen/Qwen3-0.6B-MLX-4bit"

# Training data location
data: "./data"

# Training method
train: true
test: false
fine_tune_type: "lora"
mask_prompt: true

# Training hyperparameters
batch_size: 1
num_layers: 8
iters: 200
learning_rate: 0.0001
max_seq_length: 1024

# Reporting and checkpoints
steps_per_report: 10
steps_per_eval: 50
val_batches: 10
save_every: 50

# Reproducibility
seed: 42

# Save trained adapter here
adapter_path: "adapters/dialogsum-v1"

# LoRA configuration
lora_parameters:
  keys:
    - "self_attn.q_proj"
    - "self_attn.v_proj"
  rank: 8
  scale: 20.0
  dropout: 0.0
